
    <input type="hidden" name="q" value="{{ query }}">
    <div class="flex items-center gap-3 p-2 bg-surface-dark rounded-xl border border-white/5">
        <span class="text-xs font-bold text-slate-500 uppercase ml-2">Filter by:</span>
        <select name="platform" onchange="this.form.submit()"
            class="bg-background-dark border-slate-700 rounded-lg text-sm text-white focus:ring-primary focus:border-primary">
            <option value="">All Platforms</option>
            <option value="Platform 1" {% if selected_platform == "Platform 1" %}selected{% endif %}>
                Platform 1</option>
            <option value="Platform 2" {% if selected_platform == "Platform 2" %}selected{% endif %}>
                Platform 2</option>
            <option value="Platform 3" {% if selected_platform == "Platform 3" %}selected{% endif %}>
                Platform 3</option>
        </select>
    
    
    <input type="text" name="genre" placeholder="Genre..." value="{{ request.GET.genre|default:'' }}"
        class="bg-background-dark border-slate-700 rounded-lg text-sm text-white">
    
    
    <input type="text" name="director" placeholder="Director..." value="{{ request.GET.director|default:'' }}"
        class="bg-background-dark border-slate-700 rounded-lg text-sm text-white">
    </div>
