{% load i18n %}
<div id="watchlist-modal" class="fixed inset-0 z-[100] hidden">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeWatchlistModal()"></div>
    
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-md glass-panel border border-white/10 rounded-3xl p-6 shadow-2xl">
        <!-- Toast notification -->
        <div id="watchlist-toast" class="hidden fixed top-8 left-1/2 -translate-x-1/2 z-[200] px-6 py-3 rounded-xl bg-emerald-500 text-white font-semibold shadow-lg flex items-center gap-2">
            <span id="toast-icon" class="material-symbols-outlined text-sm">check_circle</span>
            <span id="toast-message">{% trans "Saved!" %}</span>
        </div>
        
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <div class="size-10 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center">
                    <span class="material-symbols-outlined">bookmark_add</span>
                </div>
                <h2 class="text-xl font-bold text-white">{% trans "Add to Watchlist" %}</h2>
            </div>
            <button onclick="closeWatchlistModal()" class="text-text-secondary hover:text-white transition-colors p-2 rounded-lg hover:bg-white/5">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        
        <div id="watchlist-lists" class="space-y-2 mb-6 max-h-80 overflow-y-auto">
            <div class="text-center py-8 text-text-secondary">
                <span class="material-symbols-outlined text-4xl mb-2">hourglass_empty</span>
                <p>{% trans "Loading lists..." %}</p>
            </div>
        </div>
        
        <div class="border-t border-white/5 pt-4">
            <button id="create-list-btn" onclick="showCreateListInput()" class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl border border-dashed border-white/20 text-text-secondary hover:text-primary hover:border-primary/50 transition-all">
                <span class="material-symbols-outlined">add</span>
                <span>{% trans "Create New List" %}</span>
            </button>
            
            <div id="create-list-form" class="hidden flex gap-2 mt-2">
                <input type="text" id="new-list-name" placeholder="{% trans 'List name...' %}" 
                    style="color: #050505 !important;"
                    class="flex-1 px-4 py-3 rounded-xl bg-surface-highlight border border-white/10 placeholder-slate-500 focus:outline-none focus:border-primary/50 transition-colors"
                    maxlength="200"
                    onkeydown="if(event.key === 'Enter') createNewList()">
                <button onclick="createNewList()" class="px-4 py-3 rounded-xl bg-primary text-white font-semibold hover:bg-primary/80 transition-colors">
                    <span class="material-symbols-outlined">check</span>
                </button>
                <button onclick="hideCreateListInput()" class="px-4 py-3 rounded-xl border border-white/10 text-text-secondary hover:text-white transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
        </div>
    </div>
</div>
