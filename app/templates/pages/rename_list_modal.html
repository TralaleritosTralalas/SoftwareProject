{% load i18n %}
{# Rename List Modal — incluir en personal_library.html y list_detail.html #}
{# Requiere watchlist.js (initRenameModal / openRenameListModal / closeRenameModal) #}
<div id="rename-list-modal" class="fixed inset-0 z-[110] hidden" data-list-id="">

    <!-- Overlay -->
    <div id="rename-modal-overlay"
         class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>

    <!-- Panel -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2
                w-full max-w-sm
                bg-[#131c2e] border border-white/10 rounded-3xl
                p-7 shadow-2xl shadow-black/60">

        <!-- Header -->
        <div class="flex items-center gap-3 mb-6">
            <div class="size-10 rounded-xl bg-primary/15 text-primary flex items-center justify-center flex-shrink-0">
                <span class="material-symbols-outlined">edit</span>
            </div>
            <div>
                <h2 class="text-lg font-bold text-white leading-tight">{% trans "Rename List" %}</h2>
                <p class="text-xs text-slate-400 mt-0.5">{% trans "Enter a new name for this list." %}</p>
            </div>
            <button onclick="closeRenameModal()"
                    class="ml-auto p-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-colors">
                <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
        </div>

        <!-- Form -->
        <form id="rename-list-form" class="space-y-4">
            <input
                type="text"
                id="rename-list-input"
                placeholder="{% trans 'List name…' %}"
                maxlength="200"
                autocomplete="off"
                class="w-full px-4 py-3 rounded-xl
                       bg-white/5 border border-white/15
                       text-white placeholder-slate-500
                       text-sm font-medium
                       focus:outline-none focus:border-primary/60 focus:ring-2 focus:ring-primary/20
                       transition-all"
            >
            <p id="rename-list-error" class="text-red-400 text-xs min-h-[1rem]"></p>

            <div class="flex gap-3 pt-1">
                <button type="button" id="rename-cancel-btn"
                        class="flex-1 py-2.5 rounded-xl border border-white/10 text-slate-300 text-sm font-semibold hover:bg-white/5 transition-colors">
                    {% trans "Cancel" %}
                </button>
                <button type="submit"
                        class="flex-1 py-2.5 rounded-xl bg-primary text-white text-sm font-bold hover:bg-primary/85 transition-colors shadow-lg shadow-primary/20">
                    {% trans "Rename" %}
                </button>
            </div>
        </form>
    </div>
</div>
