{% extends "base/initial.html" %}

{% block title %}StreamSync – Password Reset Complete{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center cinematic-bg">
    <div class="z-10 w-full max-w-[500px] px-8">
        <div class="bg-slate-900/60 backdrop-blur-xl border border-white/10 rounded-3xl p-10 text-center shadow-2xl">
            <div class="w-20 h-20 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                <span class="material-symbols-outlined text-green-500 text-4xl">check_circle</span>
            </div>
            <h2 class="text-3xl font-bold text-white mb-4">Password Updated!</h2>
            <p class="text-slate-400 text-lg mb-8">
                Your password has been changed successfully. You can now use your new credentials to access your account.
            </p>
            <a href="{% url 'login' %}" class="inline-block w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl transition-all shadow-lg">
                Go to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
