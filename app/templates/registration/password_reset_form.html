{% extends "base/initial.html" %}

{% block title %}StreamSync – Password Reset{% endblock %}


{% block content %}
    <style>
        .glass-panel {
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(16, 22, 35, 0.6);
        }
    </style>

    <div class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
        <div class="relative min-h-screen w-full flex items-center justify-center cinematic-bg overflow-hidden">
            <div class="z-10 w-full max-w-[540px] px-8 py-12">
                <div class="flex flex-col items-center mb-10 text-center">
                    <h1 class="text-4xl font-bold tracking-tight mb-4 text-white">Reset Password</h1>
                    <p class="text-slate-400 text-lg">Enter your email and we'll send you instructions.</p>
                </div>

                <div class="glass-panel rounded-2xl p-10 shadow-2xl">
                    <form method="post" class="space-y-6">
                        {% csrf_token %}
                        <div>
                            <label class="block text-base font-medium text-slate-300 mb-2" for="id_email">Email
                                Address</label>
                            <input name="email" id="id_email" required
                                   class="w-full bg-slate-900/50 border border-slate-700 rounded-lg h-14 px-5 text-lg text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-slate-600"
                                   placeholder="name@example.com" type="email"/>
                        </div>

                        <div class="pt-2">
                            <button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 px-6 rounded-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-3 group text-xl"
                                    type="submit">
                                Send Reset Link
                                <span class="material-symbols-outlined text-2xl">mail</span>
                            </button>
                        </div>
                    </form>
                    <div class="mt-8 pt-6 border-t border-slate-800/50 text-center">
                        <a href="{% url 'login' %}"
                           class="text-primary font-semibold hover:text-blue-400 flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined text-sm">arrow_back</span> Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
