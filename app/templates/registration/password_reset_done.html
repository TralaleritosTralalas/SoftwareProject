{% extends "base/initial.html" %}

{% block content %}
    <div class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center cinematic-bg">
        <div class="z-10 w-full max-w-[500px] px-8">
            <div class="bg-slate-900/60 backdrop-blur-xl border border-white/10 rounded-3xl p-10 text-center shadow-2xl">
                <div class="w-20 h-20 bg-primary/20 rounded-full flex items-center justify-center mx-auto mb-6">
                    <span class="material-symbols-outlined text-primary text-4xl">mark_email_read</span>
                </div>
                <h2 class="text-3xl font-bold text-white mb-4">Check your inbox</h2>
                <p class="text-slate-400 text-lg mb-8">
                    We've sent an email to your address. If it doesn't appear, check your spam folder.
                </p>
                <a href="{% url 'login' %}"
                   class="inline-block w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl transition-all shadow-lg">
                    Return to Login
                </a>
            </div>
        </div>
    </div>
{% endblock %}
